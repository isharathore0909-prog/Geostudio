<!DOCTYPE html>
<html lang="en" style="background-color: #ffffff;">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoStudio Map Engine</title>
  <style>
    html, body, #map, #offlineBackground { background-color: #ffffff !important; }
  </style>
  <!-- Local OpenLayers Styles and Modular CSS (100% Offline-Safe) -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="Vendor/ol.css">
  <link rel="stylesheet" href="map.css">
  <link rel="stylesheet" href="Styles/Widgets/widgets.css">
  <script src="Vendor/ol.js"></script>
</head>

<body style="background-color: #ffffff;">
  <div id="offlineBackground" style="background-color: #ffffff;"></div>
  <div id="map" style="background-color: #ffffff;"></div>
  
  <!-- Map Feature Info & Coordinate Popup Overlay -->
  <div id="mapPopup" class="ol-popup">
    <a href="#" id="mapPopupCloser" class="ol-popup-closer">✖</a>
    <div id="mapPopupContent"></div>
  </div>

  <canvas id="pointCloudCanvas"></canvas>
  <div id="swipeContainer">
    <div id="swipeLine"></div>
    <div id="swipeHandle" title="Drag left/right to compare layers">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
        <polyline points="7 16 3 12 7 8"></polyline>
        <polyline points="17 8 21 12 17 16"></polyline>
        <line x1="12" y1="5" x2="12" y2="19" stroke-width="2"></line>
      </svg>
    </div>
  </div>
  <div id="swipeBadge">
    <button id="btnSwapSwipe" style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; padding: 2px 7px; cursor: pointer; font-size: 11px; font-weight: 600; margin-right: 6px;">⇄ Swap</button>
    <span id="swipeLabel">◀ Layer A | Layer B ▶</span>
    <button id="btnExitSwipe" style="background: rgba(255,255,255,0.25); border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; font-weight: bold; line-height: 20px; text-align: center; margin-left: 8px;">✕</button>
  </div>
  <div id="shaderScaleWidget" class="shader-scale-widget" style="display: none;">
    <div class="shader-scale-header" id="shaderScaleHeader" title="Click to collapse / expand scale">
      <span class="shader-scale-icon" id="shaderScaleIcon">🏔️</span>
      <span class="shader-scale-title" id="shaderScaleTitle">Elevation</span>
      <button class="shader-scale-toggle" id="shaderScaleToggle" title="Collapse / expand">▾</button>
    </div>
    <div class="shader-scale-body" id="shaderScaleBody">
      <div class="shader-scale-bar-container">
        <div class="shader-scale-bar" id="shaderScaleBar"></div>
      </div>
      <div class="shader-scale-ticks">
        <span class="scale-tick min" id="shaderScaleMin">-- m</span>
        <span class="scale-tick mid" id="shaderScaleMid">-- m</span>
        <span class="scale-tick max" id="shaderScaleMax">-- m</span>
      </div>
      <div class="shader-scale-subtext" id="shaderScaleSubtext">Global Mapper 3D Shaded Relief</div>
    </div>
  </div>
  <div id="lidarLegendWidget" class="lidar-legend-widget" style="display: none;">
    <div class="lidar-legend-header" id="lidarLegendHeader" title="Click to collapse / expand LiDAR legend">
      <span class="lidar-legend-icon" id="lidarLegendIcon">🏷️</span>
      <span class="lidar-legend-title" id="lidarLegendTitle">LiDAR: Classification</span>
      <button class="lidar-legend-toggle" id="lidarLegendToggle" title="Collapse / expand">▾</button>
    </div>
    <div class="lidar-legend-body" id="lidarLegendBody">
      <div id="lidarLegendContent"></div>
      <div class="lidar-legend-subtext" id="lidarLegendSubtext">ASPRS Standard Classes</div>
    </div>
  </div>

  <!-- Modular Map Engine Architecture -->
  <!-- 1. Point Cloud Modules -->
  <script src="PointCloud/pointCloudPalettes.js"></script>
  <script src="PointCloud/pointCloudLegend.js"></script>
  <script src="PointCloud/pointCloudCanvas.js"></script>
  <script src="PointCloud/pointCloudRenderer.js"></script>

  <!-- 2. Core Map & Source Modules -->
  <script src="Core/mapSources.js"></script>
  <script src="Core/mapEngine.js"></script>
  <script src="Core/mapInteractions.js"></script>
  <script src="Core/mapSwipe.js"></script>
  <script src="Core/mapTelemetry.js"></script>

  <!-- 3. Raster Modules -->
  <script src="Raster/shaderScaleWidget.js"></script>
  <script src="Raster/rasterLayerManager.js"></script>

  <!-- 4. Bridge Modules -->
  <script src="Bridge/mapRasterBridge.js"></script>
  <script src="Bridge/mapVectorBridge.js"></script>
  <script src="Bridge/mapLayerBridge.js"></script>
  <script src="Bridge/mapHostBridge.js"></script>
</body>

</html>
